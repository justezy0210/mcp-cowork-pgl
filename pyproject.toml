[project]
name = "cowork-hub"
version = "0.1.0"
description = "A small, persistent resource reservation hub for laboratory containers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
web = ["firebase-admin>=7,<8"]

[project.scripts]
cowork-hub = "cowork_hub.cli:main"
cowork-mcp = "cowork_hub.mcp_server:main"
cowork-run = "cowork_hub.runner:main"
cowork-connector = "cowork_hub.connector:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cowork_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
